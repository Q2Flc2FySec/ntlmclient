[project]
name = "ntlmclient"
version = "0.1.0"
description = "NTLM-over-HTTP Authentication Client (ohne Signing)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["impacket>=0.12"]

[project.scripts]
ntlmclient = "ntlmclient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntlmclient"]
